# Full stack: Nginx (TLS) -> Next.js + Flask API (N replicas) -> MySQL (TLS-only, TDE) + Redis.
#   cp .env.docker.example .env.docker   # fill in secrets (python backend/scripts/gen_keys.py)
#   ./docker/nginx/gen-certs.sh
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker run --rm migrate
#   docker compose --env-file .env.docker run --rm api python3.12 scripts/seed.py
name: homenest

x-api-env: &api-env
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY}
  KEK_KEYS: ${KEK_KEYS}
  KEK_ACTIVE: ${KEK_ACTIVE}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
  DATABASE_URL: mysql+pymysql://homenest_app:${HOMENEST_DB_PASSWORD}@mysql:3306/homenest?charset=utf8mb4
  MIGRATION_DATABASE_URL: mysql+pymysql://homenest_migrator:${HOMENEST_DB_PASSWORD}@mysql:3306/homenest?charset=utf8mb4
  BACKUP_DATABASE_URL: mysql://homenest_backup:${HOMENEST_DB_PASSWORD}@mysql:3306/homenest
  DB_SSL_REQUIRED: "true"
  DB_SQL_DIR: /db
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  COOKIE_SECURE: "true"
  FRONTEND_URL: https://localhost
  UPLOAD_DIR: /data/uploads
  BACKUP_DIR: /data/backups
  SMTP_URL: ${SMTP_URL:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  PROMETHEUS_METRICS: "1"

services:
  mysql:
    build: { context: ., dockerfile: docker/mysql/Dockerfile }
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      HOMENEST_DB_PASSWORD: ${HOMENEST_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-keyring:/var/lib/mysql-keyring
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--ssl-mode=REQUIRED"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *api-env
    command: ["python3.12", "-m", "alembic", "upgrade", "head"]
    depends_on: { mysql: { condition: service_healthy } }
    profiles: [tools]

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *api-env
    volumes: [app-data:/data]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
    deploy: { replicas: 2 }
    healthcheck:
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *api-env
    volumes: [app-data:/data]
    command: ["python3.12", "worker.py"]
    depends_on: [api]

  scheduler:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *api-env
    command: ["python3.12", "scripts/run_alerts.py", "--loop"]
    depends_on: [api]

  web:
    build: { context: frontend }
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]

  nginx:
    image: nginx:1.27.4-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on: [api, web]

volumes:
  mysql-data:
  mysql-keyring:
  redis-data:
  app-data:
