  <!-- ER inset -->
  <rect class="panel" x="40" y="850" width="1060" height="300" rx="12"/>
  <text class="h" x="60" y="880">Core data model (MySQL 8, InnoDB, utf8mb4)</text>

  <path class="rel" d="M230,945 L280,945"/>
  <path class="rel" d="M460,945 L500,945"/>
  <path class="rel" d="M680,945 L720,945"/>
  <path class="rel" d="M660,990 L660,1005 L990,1005 L990,990"/>
  <path class="rel" d="M590,990 L590,1040"/>
  <path class="rel" d="M780,1005 L780,1040"/>
  <path class="rel" d="M500,1085 L460,1085"/>
  <path class="rel" d="M860,1085 L900,1085"/>
  <path class="rel" d="M590,1130 L590,1140 L990,1140 L990,1130"/>
  <path class="rel" d="M140,990 L140,1040"/>

  <g>
    <rect class="ent" x="50" y="900" width="180" height="90" rx="6"/><rect class="enth" x="50.6" y="900.6" width="178.8" height="24" rx="6"/>
    <text class="entt" x="60" y="917">users</text>
    <text class="entc" x="60" y="942">public_id ULID</text><text class="entc" x="60" y="958">email_hash · pw_hash</text><text class="entc" x="60" y="974">role · status</text>

    <rect class="ent" x="280" y="900" width="180" height="90" rx="6"/><rect class="enth" x="280.6" y="900.6" width="178.8" height="24" rx="6"/>
    <text class="entt" x="290" y="917">host_profiles</text>
    <text class="entc" x="290" y="942">user_id FK</text><text class="entc" x="290" y="958">license_enc</text><text class="entc" x="290" y="974">verification</text>

    <rect class="ent" x="500" y="900" width="180" height="90" rx="6"/><rect class="enth" x="500.6" y="900.6" width="178.8" height="24" rx="6"/>
    <text class="entt" x="510" y="917">listings</text>
    <text class="entc" x="510" y="942">mode · status</text><text class="entc" x="510" y="958">price DECIMAL</text><text class="entc" x="510" y="974">FULLTEXT(title,desc)</text>

    <rect class="ent" x="720" y="900" width="160" height="90" rx="6"/><rect class="enth" x="720.6" y="900.6" width="158.8" height="24" rx="6"/>
    <text class="entt" x="730" y="917">addresses</text>
    <text class="entc" x="730" y="942">city · country</text><text class="entc" x="730" y="958">street_enc</text><text class="entc" x="730" y="974">location POINT</text>

    <rect class="ent" x="900" y="900" width="180" height="90" rx="6"/><rect class="enth" x="900.6" y="900.6" width="178.8" height="24" rx="6"/>
    <text class="entt" x="910" y="917">photos · amenities</text>
    <text class="entc" x="910" y="942">listing_id FK</text><text class="entc" x="910" y="958">url · sort_order</text><text class="entc" x="910" y="974">M:N amenities</text>

    <rect class="ent" x="50" y="1040" width="180" height="90" rx="6"/><rect class="enth" x="50.6" y="1040.6" width="178.8" height="24" rx="6"/>
    <text class="entt" x="60" y="1057">audit_log</text>
