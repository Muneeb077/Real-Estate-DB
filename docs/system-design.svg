  <!-- Legend -->
  <rect class="panel" x="1140" y="850" width="540" height="300" rx="12"/>
  <text class="h" x="1160" y="880">Legend</text>
  <path class="tls" d="M1160,912 L1230,912" marker-end="url(#a)"/>
  <text class="t" x="1244" y="916">synchronous call over TLS (HTTPS / MySQL TLS)</text>
  <path class="async" d="M1160,944 L1230,944" marker-end="url(#b)"/>
  <text class="t" x="1244" y="948">asynchronous (replication, queue, webhooks)</text>
  <use href="#lk" x="1195" y="974"/>
  <text class="t" x="1244" y="980">encrypted at rest / key material</text>
  <text class="h" x="1160" y="1020">Encryption summary</text>
  <text class="t" x="1160" y="1044">• Passwords: Argon2id · tokens: SHA-256 hashes, single-use</text>
  <text class="t" x="1160" y="1066">• PII fields: AES-256-GCM envelope (DEK per record, KEK in KMS)</text>
  <text class="t" x="1160" y="1088">• Lookups: HMAC-SHA256 blind index</text>
  <text class="t" x="1160" y="1110">• Storage: InnoDB TDE · SSE-KMS buckets · encrypted backups</text>
  <text class="t" x="1160" y="1132">• Transit: TLS 1.3 edge, TLS-only MySQL, signed URLs</text>
